name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PushScroll.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PushScroll-apk
          path: PushScroll.apk
      - name: Publish download link (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PushScroll (latest build)
          body: Download PushScroll.apk below and open it on your Android phone to install.
          make_latest: true
          files: PushScroll.apk
